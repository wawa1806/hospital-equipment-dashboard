[project]
name = "hospital-equipment-dashboard"
version = "0.1.0"
description = "Generación de dataset y dashboard para equipos médicos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.28.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
      packages = ["src/data_generator"]